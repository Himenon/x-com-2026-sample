name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build and start services
        run: docker compose up --build --detach --wait
      - name: Check rendering and persisted mutation
        shell: bash
        run: |
          set -euo pipefail
          base_url=http://127.0.0.1:3000
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            "$base_url/health" | jq -e '.status == "ok"'
          curl --fail --silent --show-error --max-time 30 "$base_url/" > /tmp/town-square-page.html
          grep -q 'Sora Tanaka' /tmp/town-square-page.html
          grep -q 'Stream complete' /tmp/town-square-page.html

          python3 - <<'PY'
          import http.client
          import time

          connection = http.client.HTTPConnection('127.0.0.1', 3000, timeout=30)
          connection.request('GET', '/')
          response = connection.getresponse()
          first = response.read1(1)
          first_at = time.monotonic()
          body = first + response.read()
          elapsed = time.monotonic() - first_at
          assert response.status == 200 and b'Stream complete' in body
          assert elapsed > 0.3, f'HTML was not streamed progressively: {elapsed:.2f}s'
          connection.close()
          PY

          graphql() {
            curl --fail --silent --show-error -H 'content-type: application/json' \
              --data "$1" "$base_url/graphql"
          }
          query='{"query":"{ posts { id likes } }"}'
          initial=$(graphql "$query" | jq -er '.data.posts[] | select(.id == "post-1") | .likes')
          updated=$(graphql '{"query":"mutation { likePost(id: \"post-1\") { id likes } }"}' | jq -er '.data.likePost.likes')
          test "$updated" -eq "$((initial + 1))"

          docker compose restart web
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors \
            "$base_url/health" | jq -e '.status == "ok"'
          persisted=$(graphql "$query" | jq -er '.data.posts[] | select(.id == "post-1") | .likes')
          test "$persisted" -eq "$updated"
      - name: Check metrics and Grafana dashboard
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl -fsSG http://127.0.0.1:9090/api/v1/query \
                --data-urlencode 'query=nodejs_eventloop_utilization{job="watt"}' |
                jq -e '[.data.result[].metric.workerId] | unique | sort == ["0", "1"]' >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:3000/health >/dev/null
            if curl -fsSG http://127.0.0.1:9090/api/v1/query \
                --data-urlencode 'query=sum(increase(http_request_all_duration_seconds_count{job="watt"}[1m])) > 0' |
                jq -e '.data.result | length > 0' >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then exit 1; fi
            sleep 2
          done
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors -u admin:admin \
            http://127.0.0.1:3001/api/datasources/uid/prometheus/health | jq -e '.status == "OK"'
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors -u admin:admin \
            http://127.0.0.1:3001/api/dashboards/uid/watt-overview | jq -e '.dashboard.panels | length > 0'
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down --volumes --remove-orphans
