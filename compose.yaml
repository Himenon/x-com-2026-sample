services:
  proxy:
    image: nginx:alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DNS_RESOLVER=$$(awk '/^nameserver/ {print $$2; exit}' /etc/resolv.conf)
        export DNS_RESOLVER
        exec /docker-entrypoint.sh nginx -g 'daemon off;'
    environment:
      NGINX_ENVSUBST_FILTER: ^DNS_RESOLVER$$
    ports:
      - "3000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
  web:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://sample:sample@postgres:5432/sample
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sample
      POSTGRES_USER: sample
      POSTGRES_PASSWORD: sample
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/001-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sample -d sample"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
